# Builds the API + Orchestrator + Web images in Cloud Build and pushes them to Artifact
# Registry. Invoked by infra/scripts/deploy-cloud-run.sh (passes the image refs).
steps:
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args: ['build', '-f', 'services/api/Dockerfile', '-t', '${_IMAGE_API}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-orchestrator
    args: ['build', '-f', 'services/orchestrator/Dockerfile', '-t', '${_IMAGE_ORCH}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-web
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_MODE=${_AUTH_MODE}'
      # Firebase web config (public). Empty in dev mode; required when _AUTH_MODE=firebase.
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '-t'
      - '${_IMAGE_WEB}'
      - '.'
images:
  - '${_IMAGE_API}'
  - '${_IMAGE_ORCH}'
  - '${_IMAGE_WEB}'
options:
  machineType: E2_HIGHCPU_8
  # The _FIREBASE_* substitutions are only passed in firebase mode; allow them to be unset.
  substitution_option: 'ALLOW_LOOSE'
timeout: 1200s
